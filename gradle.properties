org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true

# android.nonTransitiveRClass is deliberately absent: it has been the default
# since AGP 8, so setting it bought nothing, and a flag AGP has since retired is
# a build failure rather than a no-op.
